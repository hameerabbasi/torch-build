[workspace]
authors = ["Hameer Abbasi <2190658+hameerabbasi@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "pixi-pytorch-dev"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[feature.core.tasks]
build-core = { cmd = "./pixi-launch.sh ./pytorch-build.sh", cwd = "." }
build-all = { cmd = "./pixi-launch.sh ./torch-build.sh", cwd = "." }
update = { cmd = "./torch-update.sh", cwd = "." }
clone = { cmd = "./torch-clone.sh", cwd = "." }
export-env = { cmd = "./torch-env-export.sh", cwd = "." }
reset-env = { cmd = "rm ./.env", cwd = "." }

[feature.core.activation.env]
PYTORCH_BUILD_DIRECTORY = "${PIXI_PROJECT_ROOT}/git"
PYTORCH_PIXI_BUILD = "1"

[activation]
scripts = ["./torch-pixi-activate.sh"]

[feature.freethreading.dependencies]
python = "3.13.*"
python-freethreading = "3.13.*"

[dependencies]
python = "3.10.*"
onnx-ir = "*"
py-spy = ">=0.4.1,<0.5"

[target.linux-64.dependencies]
# These three don't have free-threading support
lldb = "*"
gdb = "*"
halide-python = "*"
z3-solver = "*"

[feature.core.dependencies]
pip = "*"
cpython = "*"
cmake = ">=3.27"
ninja = "*"
numpy = "*"
packaging = "*"
pkg-config = "*"
libuv = "*"
pyyaml = "*"
requests = "*"
six = "*"
typing-extensions = ">=4.10.0"
ccache = "*"
scikit-build = "*"
setuptools = ">=70.1.0,<80.0a0"
wheel = "*"
fsspec = "*"
types-dataclasses = "*"
expecttest = "*"
hypothesis = "*"
lintrunner = "*"
scipy = "*"
psutil = "*"
pytest = "*"
ghstack = "*"
ipython = "*"
pytest-sugar = "*"
pytest-xdist = "*"
filelock = "*"
sympy = "*"
astunparse = "*"
dill = "*"
jinja2 = "*"
lark = "*"
optree = "*"
tabulate = "*"
networkx = "*"
zlib = "*"
parameterized = "*"
libglib = "*"
pango = "*"
pillow = "*"
spin = "*"
mpi = { version = "*", build = "openmpi" }
uv = ">=0.9.29,<0.10"

[feature.core.target.osx-arm64.dependencies]
compilers = "*"

[feature.core.target.linux-64.dependencies]
gcc = "14.*"
gxx = "14.*"
clang = "*"
clangxx = "*"
magma = "*"
cuda-driver-dev = "*"
cuda-version = "12.9.*"
cudnn = "*"
conda-gcc-specs = "*"
cuda-libraries-dev = "*"
cuda-nvcc = "*"
cuda-gdb = "*"
cuda-nvtx-dev = "*"
cuda-nvml-dev = "*"
cuda-cupti-dev = "*"
mkl = "*"
mkl-include = "*"
nccl = "*"
sysroot_linux-64 = ">=2.17"

[environments]
default = ["default", "core"]
freethreading = { features = [
    "freethreading",
    "core",
], no-default-feature = true }
